<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Turmeric powder in a glass jar">
  <rect width="800" height="600" fill="#fdf6e7"/>
  <circle cx="400" cy="300" r="192" fill="#fbecc9"/>

  <!-- lid -->
  <rect x="296" y="214" width="208" height="42" rx="12" fill="#8d6a35"/>
  <rect x="296" y="214" width="208" height="14" rx="12" fill="#a58044"/>

  <!-- glass jar -->
  <rect x="310" y="252" width="180" height="230" rx="20" fill="#ffffff" fill-opacity="0.92" stroke="#e6ddcc" stroke-width="5"/>

  <!-- powder inside -->
  <path d="M318 344 H482 V460 Q482 476 466 476 H334 Q318 476 318 460 Z" fill="#e3a417"/>
  <ellipse cx="400" cy="344" rx="82" ry="13" fill="#f0b633"/>

  <!-- label -->
  <rect x="318" y="372" width="164" height="58" rx="8" fill="#ffffff" fill-opacity="0.88"/>
  <rect x="334" y="390" width="92" height="7" rx="3.5" fill="#d9cbb0"/>
  <rect x="334" y="405" width="58" height="7" rx="3.5" fill="#e8dcc4"/>

  <!-- glass highlight -->
  <rect x="326" y="266" width="16" height="132" rx="8" fill="#ffffff" fill-opacity="0.7"/>

  <!-- spilled powder at base -->
  <path d="M470 486 q34 -22 68 -6 q10 4 4 10 h-64 q-10 -2 -8 -4 Z" fill="#e3a417" fill-opacity="0.85"/>

  <ellipse cx="400" cy="504" rx="132" ry="16" fill="#000000" opacity="0.06"/>
</svg>
